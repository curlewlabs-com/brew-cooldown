name: Homebrew release

# Keep the qualified commit on Homebrew's newest release: brew update moves a
# stable installation to that tag, and upgrade refuses there until
# VALIDATED_HOMEBREW_COMMIT names it. Each run first merges a proposal whose
# qualification passed (script/merge-homebrew-release), then proposes the newest
# release if it is not yet qualified (script/propose-homebrew-release).
on:
  schedule:
    # Homebrew tags releases at any time of day, and this line is what finds a
    # new one and merges a proposal whose qualification passed. It runs every
    # 15 minutes so a qualified release merges soon after its last gating run
    # finishes; until it does, every scheduled upgrade that brew update moved
    # to the release refuses. GitHub starts a scheduled run only when its queue
    # allows, which has left a line running hours apart, so the slots arrive on
    # time through the repository_dispatch below instead, and this schedule
    # stays as the backstop for when that clock is down.
    - cron: "2,17,32,47 * * * *"
  # Each slot of the line above, sent on time by a github-cron-trigger clock
  # (https://github.com/curlewlabs-com/github-cron-trigger). Both passes read
  # the current state and a repeated run changes nothing, so a slot delivered
  # by the clock and again by the schedule needs no deduplication, and the
  # project's slot action and ledger are not used. A workflow_run trigger
  # would merge sooner, but it runs with this repository's write token on the
  # word of another run, which a fork's pull request can start; the line above
  # needs no such trust.
  repository_dispatch:
    types: [github-cron-trigger/homebrew-release.yml]
  workflow_dispatch:

# GitHub does not run a pull request's workflows unattended when the job token
# opened it or moved its head: the runs wait for approval by someone with write
# access, or never start. So the call that must start a proposal's CI and
# Qualify runs, opening it, uses PROPOSAL_TOKEN, a fine-grained token limited
# to this repository's pull requests (CONTRIBUTING.md). It can neither push nor
# merge; the job token does both.
permissions: {}

concurrency:
  group: homebrew-release

jobs:
  merge:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push proposal branches, merge qualified ones
      pull-requests: write # merge and close proposals
      actions: read # find the Qualify runs on a proposal's head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # script/merge-homebrew-release deletes a stale proposal's branch
          # with this checkout's token, by a push that holds only while the
          # branch is where the run read it.
          persist-credentials: true
      - run: script/merge-homebrew-release
        env:
          GH_TOKEN: ${{ github.token }}

  propose:
    needs: merge
    # A failed merge pass must not keep a newer release from being proposed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push proposal branches, merge qualified ones
      pull-requests: write # merge and close proposals
      actions: read # find the Qualify runs on a proposal's head
    steps:
      # main as it is now, not the commit this run started on: the merge job
      # may have moved it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # script/propose-homebrew-release pushes the proposal branch with
          # this checkout's token.
          persist-credentials: true
      - run: script/propose-homebrew-release
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_TOKEN: ${{ secrets.HOMEBREW_RELEASE_PR_TOKEN }}
