name: Homebrew release

# Keep the qualified commit on Homebrew's newest release: brew update moves a
# stable installation to that tag, and upgrade refuses there until
# VALIDATED_HOMEBREW_COMMIT names it. Each run first merges a proposal whose
# qualification passed (script/merge-homebrew-release), then proposes the newest
# release if it is not yet qualified (script/propose-homebrew-release).
on:
  schedule:
    # Homebrew tags releases at any time of day, and a merged proposal reaches
    # scheduled upgrades only on their next run. Checking hourly keeps both
    # steps close behind the tag and its qualification.
    - cron: "17 * * * *"
  workflow_dispatch:

# GitHub does not run a pull request's workflows unattended when the job token
# opened it or moved its head: the runs wait for approval by someone with write
# access, or never start. So the two calls that must start a proposal's CI and
# Qualify runs - opening it and bringing it up to date with main - use
# PROPOSAL_TOKEN, a fine-grained token limited to this repository's pull
# requests (CONTRIBUTING.md). It can neither push nor merge; the job token does
# both.
permissions:
  contents: write # push proposal branches, merge qualified ones
  pull-requests: write # merge and close proposals
  actions: read # find the Qualify runs on a proposal's head

concurrency:
  group: homebrew-release

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: script/merge-homebrew-release
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_TOKEN: ${{ secrets.HOMEBREW_RELEASE_PR_TOKEN }}

  propose:
    needs: merge
    # A failed merge pass must not keep a newer release from being proposed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      # main as it is now, not the commit this run started on: the merge job
      # may have moved it.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - run: script/propose-homebrew-release
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_TOKEN: ${{ secrets.HOMEBREW_RELEASE_PR_TOKEN }}
