name: CI

# Gate every PR (and post-merge main) on the checks a contributor runs locally:
# the syntax pass and unit suite under real Homebrew on macOS, and the shared
# baseline checks, shellcheck included, on Linux. See CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    # Apple Silicon Tahoe is the platform the executor supports, and the
    # registry tests exercise native bottle selection only on that tag.
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The suite runs inside Homebrew's Ruby against Homebrew's internal
      # libraries, which change without notice. Test against the commit the
      # executor is qualified on instead of whatever the image shipped with.
      # The value comes from the same file the executor enforces.
      - name: pin Homebrew to the qualified commit
        run: |
          commit=$(ruby -r ./lib/brew_cooldown/validated_homebrew -e 'print BrewCooldown::VALIDATED_HOMEBREW_COMMIT')
          repository=$(brew --repository)
          git -C "$repository" fetch --quiet origin "$commit"
          git -C "$repository" checkout --quiet --detach "$commit"
          test "$(git -C "$repository" rev-parse HEAD)" = "$commit"
          brew --version
      - name: syntax pass and unit tests
        run: script/unit-tests

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@c737cbfb15dc18daffdcc34a2f01e114a389643f # v0.3.8

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs: [unit-test, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          UNIT_TEST: ${{ needs.unit-test.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$UNIT_TEST" = success && test "$BASELINE" = success
